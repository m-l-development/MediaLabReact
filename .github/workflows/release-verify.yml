# Etter Vercels produksjonsdeploy (docs/publisering.md): kontrollerer at produksjonen kjører commiten (deploystatus,
# version.json, hovedadressene) og spoler så connecthub fram til den (bare fast-forward – nyere arbeid overskrives aldri).
# Utløses av Vercels deployment_status (Vercel-appen, ikke GITHUB_TOKEN), uansett hvem som merget. Workflow-filen leses
# fra den deployede commiten, så den virker fra og med første release som inneholder den.
name: Release verify

on:
  deployment_status:

concurrency:
  group: release-verify
  cancel-in-progress: false

permissions:
  contents: write
  deployments: read

jobs:
  verify:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kontroller produksjonen og spol connecthub fram
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node web/tools/release-gate.mjs "${{ github.event.deployment.sha }}" --after-deploy
